name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint, Type-check, Build, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: isolated-ci-test
          POSTGRES_DB: nexus_audit_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nexus_test:isolated-ci-test@127.0.0.1:55439/nexus_audit_test
      TEST_DATABASE_URL: postgresql://nexus_test:isolated-ci-test@127.0.0.1:55439/nexus_audit_test
      JWT_ACCESS_SECRET: ci-test-access-secret-min-32-characters-long
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-characters-long

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type check
        run: npm run type-check

      - name: Build (Nest)
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      - name: Apply migrations to isolated test database
        run: npm run prisma:migrate:deploy

      - name: Verify PostgreSQL rollback and concurrency
        run: npm run test:postgres
